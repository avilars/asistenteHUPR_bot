version: "3.1"

nlu:

# ============================================================
# SALUDOS / DESPEDIDA / VOLVER
# ============================================================

- intent: saludar
  examples: |
    - hey
    - qué tal
    - buenos días
    - buenas tardes
    - buenas noches
    - holaaa
    - hola bot
    - hola, qué hay

- intent: start
  examples: |
    - /start
    - quiero empezar
    - iniciar
    - empezar

- intent: despedir
  examples: |
    - gracias
    - muchas gracias
    - perfecto gracias
    - ok gracias
    - adiós
    - hasta luego
    - nos vemos
    - chao

- intent: volver_menu
  examples: |
    - volver
    - menú
    - menú principal
    - volver al menú
    - volver al inicio
    - inicio
    - empezar de nuevo
    - quiero empezar otra vez
    - ir al menú

