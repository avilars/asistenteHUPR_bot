version: "3.1"

intents:
  - saludar
  - despedir
  - volver_menu
  - start
  - seleccionar_proceso
  - seleccionar_tema
  - preguntar_subtema
  - afirmar
  - negar
  - proporcionar_datos
  - fuera_de_tema

entities: []

slots: {}

responses:

  utter_saludar:
    - text: "Hola 👋 ¿en qué puedo ayudarte?"

  utter_despedir:
    - text: "Gracias a ti 😊 Si necesitas algo más, aquí estoy."

  utter_volver_menu:
    - text: "Volvemos al menú principal. ¿Qué quieres consultar?"

  utter_start:
    - text: "Hola 👋 soy tu asistente. ¿Sobre qué proceso quieres información?"

  utter_fuera_de_tema:
    - text: "Creo que eso no está relacionado con tu tratamiento. ¿Quieres volver al menú?"

  utter_preguntar_mas:
    - text: "¿Qué más te gustaría saber?"

actions:
  - action_mostrar_contenido
  - action_volver_menu

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

