        👋 Bienvenida, soy tu asistente virtual de Ginecología del Hospital Universitario Puerto Real.  
        Para empezar, elige uno de los procesos disponibles:
        1️⃣ Cáncer de mama  
        2️⃣ Mama benigna  
        3️⃣ Cáncer de endometrio  
        4️⃣ Cáncer de ovario  
